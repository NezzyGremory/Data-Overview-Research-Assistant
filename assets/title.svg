<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">DORA: Data Overview Research &amp; Assistant</title>
  <desc id="desc">A dramatic, layered three-dimensional DORA wordmark on a deep blue and violet research-themed banner.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426" />
      <stop offset="50%" stop-color="#101b43" />
      <stop offset="100%" stop-color="#211344" />
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="34%" stop-color="#dbeafe" />
      <stop offset="68%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="55%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="45%" r="52%">
