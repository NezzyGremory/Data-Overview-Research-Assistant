  <ellipse cx="600" cy="162" rx="435" ry="174" fill="url(#halo)" />
  <path d="M78 291 H1122" stroke="url(#edge)" stroke-width="2" />
  <path d="M120 84 H370 M830 84 H1080" stroke="#49659a" stroke-width="1.5" opacity=".55" />

