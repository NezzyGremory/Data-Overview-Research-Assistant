  <text x="600" y="258" text-anchor="middle" fill="#e0e7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">DATA OVERVIEW RESEARCH &amp; ASSISTANT</text>
  <text x="600" y="324" text-anchor="middle" fill="#9fb3dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">LOCAL DATA ANALYSIS  ·  MACHINE LEARNING  ·  ACADEMIC RESEARCH</text>
