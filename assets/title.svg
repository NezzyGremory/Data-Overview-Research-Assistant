      <stop offset="55%" stop-color="#6366f1" stop-opacity=".15" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
